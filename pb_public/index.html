<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find every Christmas market around Zürich on one cozy map."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="output.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="i18n.js"></script>
    <script type="text/javascript" src="auth.js" defer></script>
    <script type="text/javascript" src="app.js" defer></script>
    <title>Markt Tracker 🎄</title>
  </head>
  <body>
    <div id="map" data-i18n-attr="aria-label:mapLabel" aria-label="Map of Christmas markets"></div>
    <canvas id="snow" aria-hidden="true"></canvas>

    <aside id="panel">
      <div id="grab" class="grab" aria-hidden="true"><span></span></div>
      <header class="hero">
        <div class="topbar">
          <button type="button" id="account" class="account"></button>
          <div class="lang" role="group" data-i18n-attr="aria-label:languageLabel" aria-label="Language">
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="de">DE</button>
          </div>
        </div>
        <h1>Markt <em>Tracker</em></h1>
        <p class="tagline" data-i18n="tagline">
          Mulled wine, twinkly lights &amp; wooden chalets &mdash; every
          Christmas market around Zürich, on one map.
        </p>
        <div class="search">
          <span aria-hidden="true">🔍</span>
          <input
            id="search"
            type="search"
            placeholder="Search markets, streets, treats…"
            data-i18n-attr="placeholder:searchPlaceholder"
            autocomplete="off"
          />
        </div>
        <div id="filters" class="chips" role="group" aria-label="Filters" data-i18n-attr="aria-label:filtersLabel"></div>
      </header>

      <div id="count" class="count" aria-live="polite"></div>
      <ul id="list" class="list"></ul>
    </aside>

    <button id="toggle" data-i18n="toggleList" data-i18n-attr="aria-label:toggleLabel" aria-label="Show or hide the list">🎅 List</button>

    <dialog id="auth" aria-labelledby="auth-title">
      <form id="auth-email" method="dialog" novalidate>
        <h2 id="auth-title" data-i18n="authTitle">Sign in or sign up</h2>
        <p data-i18n="authIntro">Enter your email and we'll send you a one-time code. No password needed.</p>
        <label for="auth-email-input" data-i18n="authEmail">Email</label>
        <input id="auth-email-input" type="email" required autocomplete="email" inputmode="email" />
        <p class="auth-error" role="alert" hidden></p>
        <div class="auth-actions">
          <button type="button" class="ghost" data-close data-i18n="authCancel">Cancel</button>
          <button type="submit" class="primary" data-i18n="authSend">Send code</button>
        </div>
      </form>
      <form id="auth-code" method="dialog" novalidate hidden>
        <h2 data-i18n="authCodeTitle">Check your inbox</h2>
        <p><span data-i18n="authCodeIntro">We sent a code to</span> <b id="auth-sent-to"></b></p>
        <label for="auth-code-input" data-i18n="authCode">Code</label>
        <input id="auth-code-input" type="text" required autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" />
        <p class="auth-error" role="alert" hidden></p>
        <div class="auth-actions">
          <button type="button" class="ghost" id="auth-back" data-i18n="authBack">Back</button>
          <button type="submit" class="primary" data-i18n="authVerify">Verify</button>
        </div>
        <button type="button" class="link" id="auth-resend" data-i18n="authResend">Send a new code</button>
      </form>
    </dialog>
  </body>
</html>
